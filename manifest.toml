# What scripts/build_imagery_samples.py in the SODA repository builds into imagery/.
#
# slug        file name and set id: lower-case letters, digits and hyphens
# label       name shown in the list, Korean and English
# sensor      "optical" or "sar"
# url         the source raster, on one of the public buckets the script allows
# chips_file  instead of url: a list of small tiles to join first
# scene       instead of url: a SPOT scene product on disk, relative to the SODA repository
# center      lon, lat of the middle of the square to cut; the raster's middle when left out
# side_km     side of the square; made smaller by the script when the file would pass 95 MiB
# pixel_m     resample to this ground pixel size; left out to keep the source's pixels
# stretch     low and high percentile to spread over 8 bits; left out to keep the values
# origin      "<catalogue>:<item id>" when SODA's own catalogue search can find the same item

# ---------------------------------------------------------------- optical

[[sample]]
slug = "maxar-wajima"
label = { ko = "와지마 (일본) · Maxar 0.5 m", en = "Wajima, Japan · Maxar 0.5 m" }
